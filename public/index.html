<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picture Puzzle — sign-in / payment</title>
<style>body{font-family:sans-serif;text-align:center;padding-top:80px;color:#333}#open-app-link{display:inline-block;font-size:16px;padding:12px 24px;margin-top:24px;background:#7b2d8b;color:#fff;text-decoration:none;border-radius:8px}</style>
</head>
<body>
<p id="status">Signing in&hellip;</p>
<p id="open-app" style="display:none">
<a id="open-app-link" href="#">Return to Picture Puzzle</a>
</p>
<script>
(function () {
  // OAuth implicit flow: the access token arrives in the URL hash fragment of
  // this page.
  var params = new URLSearchParams(window.location.hash.slice(1));
  var token = params.get("access_token");
  var state = params.get("state");
  var status = document.getElementById("status");

  var isAndroid = /Android/i.test(navigator.userAgent);
  var isChrome = /Chrome\//.test(navigator.userAgent) && !/CriOS/.test(navigator.userAgent);

  // The token goes in the QUERY string (not the hash) so it survives the
  // intent -> activity hand-off on Android. Chrome blocks script-assigned
  // custom-scheme navigations ("Intent blocked by chrome"); the sanctioned
  // launch is a REAL anchor whose href is an intent:// URI — the click itself
  // is the user gesture. GodotApp.java forwards the resulting VIEW intent's
  // URI into the game via deep_link_uri.txt (user://).
  function deepLink() {
    if (isChrome) {
      return "intent://callback?access_token=" +
        encodeURIComponent(token) + "&state=" + encodeURIComponent(state || "") +
        "#Intent;scheme=picturepuzzle;package=games.gares.picturepuzzle;end";
    }
    return "picturepuzzle://callback?access_token=" +
      encodeURIComponent(token) + "&state=" + encodeURIComponent(state || "");
  }

  if (isAndroid && token) {
    document.getElementById("open-app-link").href = deepLink();
    document.getElementById("open-app").style.display = "block";
    status.textContent = "Returning to the app\u2026";
  } else if (token && window.opener) {
    // Desktop/web popup: relay the token to the game window that opened us,
    // then clean up.
    window.opener.postMessage(
      { type: "itch_oauth", access_token: token, state: state || "" },
      "*"
    );
    // Never leave the token in the address bar.
    history.replaceState(null, "", window.location.pathname + window.location.search);
    status.textContent = "Signed in! You can close this tab.";
    setTimeout(function () { window.close(); }, 1500);
  } else {
    status.textContent = "Sign-in failed. Close this tab and try again.";
  }
})();
</script>
</body>
</html>
