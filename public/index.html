<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>itch.io sign-in relay</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; padding: 80px 20px; color: #333; background: #fafafa; }
  p { font-size: 16px; }
  #status { font-weight: 500; }
  code { background: #eee; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
</style>
</head>
<body>
<p id="status">Signing in&hellip;</p>
<script>
// itch.io OAuth implicit-flow relay for the Picture Puzzle game.
//
// How it works:
//   The game runs embedded in a cross-origin iframe on itch.io, where the
//   OAuth token hash lands on the PARENT page the iframe cannot read, and
//   in-frame redirects to itch.io are blocked. So the game opens the itch
//   login page in a NEW TAB with THIS page as the OAuth callback URL. The
//   browser redirects this tab back here with the access token in the URL
//   fragment. We relay that token to the game window (the opener) via
//   postMessage, clear the fragment so the token never lingers in the address
//   bar, and close the tab. No backend, no copy/paste, no cookies needed.
//
// Register this exact URL (e.g. https://<user>.github.io/<repo>/) as the
// "Authorization callback URL" of the game's WEB OAuth application on itch.io,
// and set it as identity/itch_web_callback_url in the game's Project Settings.

(function () {
  var params = new URLSearchParams(window.location.hash.slice(1));
  var token = params.get("access_token");
  var state = params.get("state");
  var status = document.getElementById("status");

  if (token && window.opener) {
    // Send the token (and CSRF state) back to the game window that opened us.
    window.opener.postMessage(
      { type: "itch_oauth", access_token: token, state: state || "" },
      "*"
    );
    // Never leave the token in the address bar.
    history.replaceState(null, "", window.location.pathname + window.location.search);
    status.textContent = "Signed in! You can close this tab.";
    setTimeout(function () { window.close(); }, 1500);
  } else if (token && !window.opener) {
    // No opener (e.g. opened directly): still strip the token.
    history.replaceState(null, "", window.location.pathname + window.location.search);
    status.textContent = "Signed in! You can close this tab.";
  } else {
    status.textContent = "Sign-in failed. Close this tab and try again.";
  }
})();
</script>
</body>
</html>
