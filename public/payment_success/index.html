<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment complete — Picture Puzzle</title>
<style>
  body{font-family:sans-serif;text-align:center;padding-top:80px;color:#333;margin:0}
  .card{max-width:26em;margin:0 auto;padding:0 1em}
  a.btn{display:inline-block;font-size:18px;padding:14px 28px;margin-top:24px;border-radius:10px;
        background:#7b2d8b;color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>Payment complete!</h1>
  <p>Your Picture Puzzle unlock is confirmed.</p>
  <p id="status">Return to the app to use it&hellip;</p>
  <p><a id="open-app" class="btn" style="display:none" href="#">Return to Picture Puzzle</a></p>
</div>
<script>
// Landed here via the RevenueCat Web Purchase Link success redirect
// (https://puzzle.gares.games/payment_success?app_user_id=...). This page is a
// static bridge — its only job is the browser -> app jump; the game verifies
// the purchase server-side when it reopens and never trusts this URL.
//
// Chrome (and Chrome-derivatives like Samsung Internet) block script-assigned
// custom-scheme navigations, including window.location.href in click handlers
// ("Navigation is blocked: Intent blocked by chrome"). The sanctioned launch is
// a real anchor whose href is an intent:// URI — the click itself is the user
// gesture and Chrome emits the equivalent of:
//   am start -a android.intent.action.VIEW -d picturepuzzle://callback?...
// Non-Chrome browsers get the plain custom-scheme anchor (Firefox/Safari still
// honor those from a user click).
(function () {
  var isAndroid = /Android/i.test(navigator.userAgent);
  var isChrome = /Chrome\//.test(navigator.userAgent) && !/CriOS/.test(navigator.userAgent);
  var btn = document.getElementById("open-app");
  if (!isAndroid) {
    document.getElementById("status").textContent =
      "You can close this tab — Picture Puzzle is unlocked.";
    return;
  }
  btn.style.display = "inline-block";
  document.getElementById("status").textContent =
    "Tap the button to reopen Picture Puzzle\u2026";
  if (isChrome) {
    var fallback = encodeURIComponent("https://puzzle.gares.games/payment_success");
    btn.href = "intent://callback?source=revenuecat" +
      "#Intent;scheme=picturepuzzle;package=games.gares.picturepuzzle;" +
      "S.browser_fallback_url=" + fallback + ";end";
  } else {
    btn.href = "picturepuzzle://callback?source=revenuecat";
  }
})();
</script>
</body>
</html>
